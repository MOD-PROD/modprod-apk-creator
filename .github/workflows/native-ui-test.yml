name: Tester APK Base Native (APK de test)

on:
  workflow_dispatch:
  push:
    branches: [feature/native-ui-asset-library]
    paths:
      - 'base-app/apk-src/**'
      - '.github/workflows/native-ui-test.yml'

permissions:
  contents: read

jobs:
  build-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Installer Apktool
        run: curl -fLsS -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar
      - name: Préparer les sources
        run: |
          cp -r base-app/apk-src build-src
          python3 .github/scripts/apktool_json_to_yml.py build-src 2.12.1
      - name: Compiler sans signer
        run: java -jar apktool.jar b build-src -o native-ui-test-unsigned.apk
      - name: Signer APK de test avec une clé éphémère
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore test-only.jks -storepass androidtest -keypass androidtest -alias temporary-test -keyalg RSA -keysize 3072 -validity 30 -dname "CN=Temporary APK Factory Test,O=ModProd Test"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 native-ui-test-unsigned.apk native-ui-test-aligned.apk
          "$BT/apksigner" sign --ks test-only.jks --ks-key-alias temporary-test --ks-pass pass:androidtest --key-pass pass:androidtest --out native-ui-test-installable.apk native-ui-test-aligned.apk
          "$BT/apksigner" verify --print-certs native-ui-test-installable.apk
          rm -f test-only.jks native-ui-test-aligned.apk
      - name: Fournir l'APK installable pour les tests
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-test-installable
          path: native-ui-test-installable.apk
          retention-days: 7
      - name: Conserver le résultat de compilation pour diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-test-unsigned
          path: native-ui-test-unsigned.apk
          retention-days: 7

# IMPORTANT : clé éphémère créée pour chaque run, sans secret ModProd. Ne pas utiliser pour des mises à jour ou la production.
# Aucun APK n'est publié en release.
