name: Publish native-ui experimental base

# Publie une base APK + patches experimentaux pour tester WebTheme / native UI.
# N'ecrit JAMAIS dans la release production base-apk.
# Release cible : tag prerelease native-ui-experimental.

on:
  workflow_dispatch:
  push:
    branches: [feature/native-ui-asset-library]
    paths:
      - 'base-app/apk-src/**'
      - 'patches/**'
      - '.github/workflows/publish-native-ui-experimental.yml'

permissions:
  contents: write

env:
  APKTOOL_VERSION: '2.12.1'
  RELEASE_TAG: native-ui-experimental

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build experimental patches (.mpp)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :patches:build --no-daemon
          MPP=$(ls patches/build/libs/patches-*.mpp | head -1)
          cp "$MPP" patches-native-ui.mpp
          echo "MPP=$MPP"
          ls -la patches-native-ui.mpp

      - name: Build experimental apk-base.apk
        run: |
          set -euo pipefail
          curl -fsSL -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          cp -r base-app/apk-src build-src
          python3 .github/scripts/apktool_json_to_yml.py build-src "$APKTOOL_VERSION"
          test -f build-src/smali/start/WebTheme.smali
          test -f build-src/smali/start/WebThemeInjector.smali
          grep -q 'name="web_theme"' build-src/res/values/strings.xml
          java -jar apktool.jar b build-src -o unsigned.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 unsigned.apk aligned.apk
          keytool -genkeypair -keystore test.jks -storepass android -keypass android \
            -alias base -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=APK Base Native UI Experimental"
          "$BT/apksigner" sign --ks test.jks --ks-pass pass:android --out apk-base.apk aligned.apk
          "$BT/apksigner" verify apk-base.apk
          "$BT/aapt2" dump badging apk-base.apk | head -3
          ls -la apk-base.apk

      - name: Publish to prerelease native-ui-experimental
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES="Base APK + patches experimentaux (WebTheme / native UI).

Ne pas utiliser en production.

- apk-base.apk : contient WebTheme + WebThemeInjector
- patches-native-ui.mpp : option webTheme (auto/native/css/invert)

Branche source : feature/native-ui-asset-library
Commit : ${GITHUB_SHA}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes "$NOTES" --prerelease
          else
            gh release create "$RELEASE_TAG" --title "Native UI experimental base" --prerelease --notes "$NOTES"
          fi
          gh release upload "$RELEASE_TAG" apk-base.apk patches-native-ui.mpp --clobber

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-experimental
          path: |
            apk-base.apk
            patches-native-ui.mpp
          retention-days: 14
